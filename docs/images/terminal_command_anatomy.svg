<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of a terminal command</title>
  <desc id="desc">A terminal example identifies the current folder, prompt, program, action, option, and value in the command flutter run dash d chrome.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#587082"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#102a3a" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1280" height="430" rx="28" fill="#f5f9fb"/>
  <text x="640" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17324d">Anatomy of a Terminal Command</text>

  <rect x="80" y="88" width="1120" height="125" rx="20" fill="#152b3a" filter="url(#shadow)"/>
  <circle cx="115" cy="118" r="9" fill="#ed6a5e"/>
  <circle cx="143" cy="118" r="9" fill="#f4bf4f"/>
  <circle cx="171" cy="118" r="9" fill="#61c554"/>
  <text x="115" y="178" font-family="Courier New, monospace" font-size="27" fill="#9fb8c8">~/projects/volleyball_stats</text>
  <text x="546" y="178" font-family="Courier New, monospace" font-size="27" fill="#fff">$</text>
  <text x="580" y="178" font-family="Courier New, monospace" font-size="27" font-weight="700" fill="#63dfc3">flutter</text>
  <text x="715" y="178" font-family="Courier New, monospace" font-size="27" font-weight="700" fill="#72c7f2">run</text>
  <text x="788" y="178" font-family="Courier New, monospace" font-size="27" font-weight="700" fill="#d9a5ff">-d</text>
  <text x="843" y="178" font-family="Courier New, monospace" font-size="27" font-weight="700" fill="#ffc26f">chrome</text>

  <g fill="none" stroke="#587082" stroke-width="3" marker-end="url(#arrow)">
    <path d="M280 300V218"/>
    <path d="M560 300V218"/>
    <path d="M650 300V218"/>
    <path d="M800 300V218"/>
    <path d="M930 300V218"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="150" y="310" width="260" height="80" rx="15" fill="#e4edf2"/>
    <text x="280" y="344" font-size="20" font-weight="700" fill="#17324d">Current folder</text>
    <text x="280" y="373" font-size="16" fill="#40566b">where the command runs</text>

    <rect x="465" y="310" width="190" height="80" rx="15" fill="#e4edf2"/>
    <text x="560" y="344" font-size="20" font-weight="700" fill="#17324d">Prompt</text>
    <text x="560" y="373" font-size="16" fill="#40566b">ready for input</text>

    <rect x="675" y="310" width="190" height="80" rx="15" fill="#d8f2ec"/>
    <text x="770" y="344" font-size="20" font-weight="700" fill="#17324d">Program + action</text>
    <text x="770" y="373" font-size="16" fill="#40566b">Flutter should run</text>

    <rect x="885" y="310" width="245" height="80" rx="15" fill="#f5e8d7"/>
    <text x="1008" y="344" font-size="20" font-weight="700" fill="#17324d">Option + value</text>
    <text x="1008" y="373" font-size="16" fill="#40566b">use the Chrome device</text>
  </g>
</svg>
