<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">The human-computer interaction loop</title>
  <desc id="desc">A user has a goal, chooses a task, reads interface representations, performs an action, the application runs a process, and the interface gives feedback. The user evaluates that feedback and continues or changes the task.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#13796b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#143a52" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1280" height="430" rx="28" fill="#f4faf8"/>
  <text x="640" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17324d">The Human-Computer Interaction Loop</text>

  <g fill="none" stroke="#13796b" stroke-width="4" marker-end="url(#arrow)">
    <path d="M220 170H250"/>
    <path d="M430 170H460"/>
    <path d="M640 170H670"/>
    <path d="M850 170H880"/>
    <path d="M1060 170H1090"/>
    <path d="M1180 235C1180 365 100 365 100 235"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(40 105)">
      <rect width="180" height="130" rx="20" fill="#17324d" filter="url(#shadow)"/>
      <text x="90" y="34" font-size="20" font-weight="700" fill="#fff">1. User + Goal</text>
      <text x="90" y="68" font-size="16" fill="#dce9ef">What does the</text>
      <text x="90" y="92" font-size="16" fill="#dce9ef">person want?</text>
      <text x="90" y="117" font-size="14" fill="#9fd8cf">Tell my teacher</text>
    </g>
    <g transform="translate(250 105)">
      <rect width="180" height="130" rx="20" fill="#13796b" filter="url(#shadow)"/>
      <text x="90" y="34" font-size="20" font-weight="700" fill="#fff">2. Task</text>
      <text x="90" y="68" font-size="16" fill="#e0f5f0">Work the user</text>
      <text x="90" y="92" font-size="16" fill="#e0f5f0">decides to do</text>
      <text x="90" y="117" font-size="14" fill="#c6eee5">Send an email</text>
    </g>
    <g transform="translate(460 105)">
      <rect width="180" height="130" rx="20" fill="#2589bd" filter="url(#shadow)"/>
      <text x="90" y="34" font-size="19" font-weight="700" fill="#fff">3. Interface</text>
      <text x="90" y="62" font-size="15" fill="#e4f4fb">Visible controls and</text>
      <text x="90" y="84" font-size="15" fill="#e4f4fb">representations</text>
      <text x="90" y="112" font-size="14" fill="#cceaf8">Compose • Send icon</text>
    </g>
    <g transform="translate(670 105)">
      <rect width="180" height="130" rx="20" fill="#7b4ab5" filter="url(#shadow)"/>
      <text x="90" y="34" font-size="20" font-weight="700" fill="#fff">4. Action</text>
      <text x="90" y="68" font-size="16" fill="#f1e8fa">What the user</text>
      <text x="90" y="92" font-size="16" fill="#f1e8fa">does now</text>
      <text x="90" y="117" font-size="14" fill="#e5d2f4">Select Send</text>
    </g>
    <g transform="translate(880 105)">
      <rect width="180" height="130" rx="20" fill="#d46a1f" filter="url(#shadow)"/>
      <text x="90" y="34" font-size="19" font-weight="700" fill="#fff">5. App Process</text>
      <text x="90" y="68" font-size="16" fill="#fff0e1">Work happening</text>
      <text x="90" y="92" font-size="16" fill="#fff0e1">inside the system</text>
      <text x="90" y="117" font-size="14" fill="#ffe0c2">Deliver message</text>
    </g>
    <g transform="translate(1090 105)">
      <rect width="180" height="130" rx="20" fill="#a93b55" filter="url(#shadow)"/>
      <text x="90" y="34" font-size="20" font-weight="700" fill="#fff">6. Feedback</text>
      <text x="90" y="68" font-size="16" fill="#fae8ed">What the system</text>
      <text x="90" y="92" font-size="16" fill="#fae8ed">shows afterward</text>
      <text x="90" y="117" font-size="14" fill="#f7cad5">Message sent</text>
    </g>
  </g>

  <rect x="380" y="320" width="520" height="72" rx="18" fill="#fff" stroke="#86cbbf" stroke-width="3"/>
  <text x="640" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">7. The user evaluates the result</text>
  <text x="640" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#40566b">Did it work? Continue, recover from an error, or choose a new task.</text>
</svg>
