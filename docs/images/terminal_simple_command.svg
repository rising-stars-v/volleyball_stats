<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">Parts of a simple terminal command</title>
  <desc id="desc">A simplified terminal line labels the current folder, prompt, cd command, and Documents argument.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#587082"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#102a3a" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="1280" height="430" rx="28" fill="#f5f9fb"/>
  <text x="640" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17324d">Reading a Simple Terminal Command</text>

  <rect x="120" y="88" width="1040" height="125" rx="20" fill="#152b3a" filter="url(#shadow)"/>
  <circle cx="155" cy="118" r="9" fill="#ed6a5e"/>
  <circle cx="183" cy="118" r="9" fill="#f4bf4f"/>
  <circle cx="211" cy="118" r="9" fill="#61c554"/>

  <text x="285" y="178" text-anchor="end" font-family="Courier New, monospace" font-size="30" fill="#9fb8c8">home</text>
  <text x="315" y="178" font-family="Courier New, monospace" font-size="30" fill="#fff">&gt;</text>
  <text x="365" y="178" font-family="Courier New, monospace" font-size="30" font-weight="700" fill="#63dfc3">cd</text>
  <text x="430" y="178" font-family="Courier New, monospace" font-size="30" font-weight="700" fill="#72c7f2">Documents</text>
  <text x="660" y="178" font-family="Arial, sans-serif" font-size="18" fill="#9fb8c8">simplified example</text>

  <g fill="none" stroke="#587082" stroke-width="3" marker-end="url(#arrow)">
    <path d="M225 300V218"/>
    <path d="M435 300L320 218"/>
    <path d="M675 300L390 218"/>
    <path d="M1000 300L505 218"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="90" y="310" width="270" height="80" rx="15" fill="#e4edf2"/>
    <text x="225" y="344" font-size="20" font-weight="700" fill="#17324d">Current folder</text>
    <text x="225" y="373" font-size="16" fill="#40566b">where the command starts</text>

    <rect x="380" y="310" width="210" height="80" rx="15" fill="#e4edf2"/>
    <text x="485" y="344" font-size="20" font-weight="700" fill="#17324d">Prompt</text>
    <text x="485" y="373" font-size="16" fill="#40566b">ready for input</text>

    <rect x="610" y="310" width="210" height="80" rx="15" fill="#d8f2ec"/>
    <text x="715" y="344" font-size="20" font-weight="700" fill="#17324d">Command</text>
    <text x="715" y="373" font-size="16" fill="#40566b">cd means change folder</text>

    <rect x="840" y="310" width="350" height="80" rx="15" fill="#dbeefa"/>
    <text x="1015" y="344" font-size="20" font-weight="700" fill="#17324d">Argument</text>
    <text x="1015" y="373" font-size="16" fill="#40566b">Documents names the destination</text>
  </g>
</svg>
